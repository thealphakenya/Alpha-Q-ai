name: QMOI Bidirectional Cross-Repository Autosync

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      direction:
        description: "Sync direction, or audit only"
        required: false
        default: auto
        type: choice
        options: [auto, audit, qmoi-to-alpha, alpha-to-qmoi]

permissions:
  contents: read
  actions: write

concurrency:
  group: qmoi-cross-repo-autosync
  cancel-in-progress: false

env:
  QMOI_REPOSITORY: thealphakenya/qmoi-enhanced
  ALPHA_REPOSITORY: thealphakenya/Alpha-Q-ai

jobs:
  autosync:
    name: Audit and safely synchronize both repositories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.MY_CUSTOM_TOKEN }}

      - name: Select direction and validate token
        id: plan
        shell: bash
        env:
          REQUESTED_DIRECTION: ${{ inputs.direction || 'auto' }}
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN:-}" || { echo "::error::target workflow dispatch token is unavailable."; exit 1; }
          if [ "${REQUESTED_DIRECTION}" = audit ]; then
            direction=audit
          elif [ "${REQUESTED_DIRECTION}" != auto ]; then
            direction="${REQUESTED_DIRECTION}"
          elif [ "${GITHUB_REPOSITORY}" = "${QMOI_REPOSITORY}" ]; then
            direction=qmoi-to-alpha
          else
            direction=alpha-to-qmoi
          fi
          echo "direction=${direction}" >> "${GITHUB_OUTPUT}"
          echo "Selected direction: ${direction}"

      - name: Audit current repository and publish target-owned request
        env:
          DIRECTION: ${{ steps.plan.outputs.direction }}
        run: |
          set -euo pipefail
          python scripts/cross_repo_sync.py --qmoi "$GITHUB_WORKSPACE" --alpha "$GITHUB_WORKSPACE" --direction audit --report cross-repo-sync-report.json
          target="${ALPHA_REPOSITORY}"
          if [ "${GITHUB_REPOSITORY}" = "${ALPHA_REPOSITORY}" ]; then target="${QMOI_REPOSITORY}"; fi
          python scripts/qmoictl.py remote-submit \
            --target-repository "${target}" \
            --direction "${DIRECTION}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-sha "$(git rev-parse HEAD)" \
            --mode dry-run \
            --root "$GITHUB_WORKSPACE"

      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-repo-sync-report-${{ github.run_id }}
          path: cross-repo-sync-report.json
          if-no-files-found: ignore
