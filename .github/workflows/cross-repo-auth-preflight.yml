name: Cross-Repository Auth Preflight

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  statuses: read

concurrency:
  group: cross-repo-auth-preflight-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorization-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select App authentication when configured
        id: app-config
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID || secrets.QMOI_GITHUB_CLIENT_ID }}
          APP_ID: ${{ secrets.QMOI_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY || secrets.QMOI_GITHUB_PRIVATE_KEY }}
          APP_KEY_ROTATION_CONFIRMED: ${{ vars.QMOI_APP_KEY_ROTATION_CONFIRMED }}
        run: |
          set -Eeuo pipefail
          if [[ "${APP_KEY_ROTATION_CONFIRMED:-}" == "true" ]] && [[ -n "${APP_CLIENT_ID:-}" || -n "${APP_ID:-}" ]] && [[ -n "${APP_PRIVATE_KEY:-}" ]]; then
            echo "use_app=true" >> "${GITHUB_OUTPUT}"
          else
            echo "use_app=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Mint short-lived read-only App token
        id: app-token
        if: ${{ steps.app-config.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID || secrets.QMOI_GITHUB_CLIENT_ID }}
          app-id: ${{ secrets.QMOI_GITHUB_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY || secrets.QMOI_GITHUB_PRIVATE_KEY }}
          owner: thealphakenya
          repositories: |
            Alpha-Q-ai
            qmoi-enhanced
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: read

      - name: Probe repository and workflow access
        uses: actions/github-script@v7
        env:
          PEER_REPOSITORY: ${{ github.repository == 'thealphakenya/Alpha-Q-ai' && 'thealphakenya/qmoi-enhanced' || 'thealphakenya/Alpha-Q-ai' }}
          APP_KEY_ROTATION_CONFIRMED: ${{ vars.QMOI_APP_KEY_ROTATION_CONFIRMED }}
          APP_TOKEN_AVAILABLE: ${{ steps.app-token.outputs.token != '' }}
          CREDENTIAL_ROLE: ${{ steps.app-token.outputs.token != '' && 'github_app_installation_token' || 'github.token' }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            if (process.env.APP_KEY_ROTATION_CONFIRMED !== "true" || process.env.APP_TOKEN_AVAILABLE !== "true") {
              const payload = {
                status: "APP_AUTH_BLOCKED_ROTATION_UNCONFIRMED",
                credential_role: "github.token",
                app_key_rotation_confirmed: false,
                remote_mutation_performed: false,
                timestamp_utc: new Date().toISOString(),
              };
              core.summary
                .addHeading("Cross-repository authorization preflight")
                .addCodeBlock(JSON.stringify(payload, null, 2), "json")
                .write();
              core.setOutput("status", payload.status);
              core.setFailed("App authentication is blocked until the owner confirms key rotation and an installation token is available.");
              return;
            }

            const peer = process.env.PEER_REPOSITORY;
            const repositories = [context.repo.owner + "/" + context.repo.repo, peer];
            const results = [];

            for (const fullName of repositories) {
              const [owner, repo] = fullName.split("/");
              const result = { repository: fullName, repository_access: "BLOCKED", workflow_access: "BLOCKED" };
              try {
                const metadata = await github.rest.repos.get({ owner, repo });
                result.repository_access = metadata.status === 200 ? "PASS" : "BLOCKED";
              } catch (error) {
                result.repository_error = error.status || "unknown";
              }
              try {
                const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 1 });
                result.workflow_access = workflows.status === 200 ? "PASS" : "BLOCKED";
              } catch (error) {
                result.workflow_error = error.status || "unknown";
              }
              results.push(result);
            }

            const payload = {
              status: results.every((item) => item.repository_access === "PASS" && item.workflow_access === "PASS") ? "AUTH_READY" : "AUTH_BLOCKED",
              credential_role: process.env.CREDENTIAL_ROLE,
              app_key_rotation_confirmed: true,
              source_repository: context.repo.owner + "/" + context.repo.repo,
              remote_mutation_performed: false,
              results,
              timestamp_utc: new Date().toISOString(),
            };
            core.summary
              .addHeading("Cross-repository authorization preflight")
              .addCodeBlock(JSON.stringify(payload, null, 2), "json")
              .write();
            core.setOutput("status", payload.status);
            if (payload.status !== "AUTH_READY") {
              core.setFailed("Authorization preflight is AUTH_BLOCKED; no mutation was attempted.");
            }
